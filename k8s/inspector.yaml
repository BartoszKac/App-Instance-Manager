apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspector
  labels:
    app: inspector
spec:
  selector:
    matchLabels:
      app: inspector
  template:
    metadata:
      labels:
        app: inspector
    spec:
      terminationGracePeriodSeconds: 1890
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inspector
          image: app-instance-manager-inspector:local
          imagePullPolicy: IfNotPresent
          env:
            - name: INSPECTOR_MAX_CONCURRENT
              value: "4"
          ports:
            - containerPort: 9090
              name: grpc
          readinessProbe:
            grpc:
              port: 9090
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inspector-grpc
spec:
  clusterIP: None
  selector:
    app: inspector
  ports:
    - port: 9090
      targetPort: 9090
      name: grpc
