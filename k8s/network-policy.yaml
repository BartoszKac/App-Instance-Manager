apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inspector-only-from-backend
spec:
  podSelector:
    matchLabels:
      app: inspector
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 9090
          protocol: TCP
