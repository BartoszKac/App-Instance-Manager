apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: inspector
spec:
  scaleTargetRef:
    name: inspector
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 10
  cooldownPeriod: 300
  triggers:
    - type: metrics-api
      metricType: AverageValue
      metadata:
        url: http://backend.aim.svc.cluster.local:8888/api/inspections/load
        valueLocation: load
        targetValue: "4"
