spring.application.name=DynamicCode
server.port=8888

# Ścieżka do pliku bazy na dysku
spring.datasource.url=jdbc:h2:file:./data/moja_baza;DB_CLOSE_ON_EXIT=FALSE;max_compact_time=10000
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatyczne tworzenie tabel
spring.jpa.hibernate.ddl-auto=update

# Limity przesyłania dużych plików (np. 75MB+)
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB
server.tomcat.max-http-form-post-size=150MB

aim.inspection.target=${AIM_INSPECTOR_TARGET:dns:///localhost:9090}
aim.inspection.max-in-flight=40
aim.inspection.retry-delay=5s
aim.inspection.max-retries=720
aim.inspection.call-timeout=35m
aim.inspection.persistence-threads=4
