spring.application.name=DynamicCode

# Baza in-memory tylko dla testów - nie koliduje z plikową bazą produkcyjną
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

aim.inspection.target=dns:///localhost:9090
aim.inspection.max-in-flight=40
aim.inspection.retry-delay=5s
aim.inspection.max-retries=720
aim.inspection.call-timeout=35m
aim.inspection.persistence-threads=2
